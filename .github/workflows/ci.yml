name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  quality:
    if: github.event_name != 'schedule'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy,rustfmt
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - run: cargo test --doc --workspace
      - run: cargo doc --workspace --no-deps

  accelerated-soak:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - run: cargo build -p icepod-audio-service -p icepodctl
      - run: mkdir -p "$RUNNER_TEMP/icepod-runtime" "$RUNNER_TEMP/icepod-sessions"
      - run: target/debug/icepod-audio-service --simulate --runtime-dir "$RUNNER_TEMP/icepod-runtime" --sessions-dir "$RUNNER_TEMP/icepod-sessions" &
      - run: |
          for _ in $(seq 1 100); do test -f "$RUNNER_TEMP/icepod-runtime/service.token" && break; sleep 0.1; done
          target/debug/icepodctl --runtime-dir "$RUNNER_TEMP/icepod-runtime" soak --hours 4 --channels 4 --report soak.json
      - uses: actions/upload-artifact@v4
        with:
          name: accelerated-soak-report
          path: soak.json
