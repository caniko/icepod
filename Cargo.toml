[workspace]
members = [
  "crates/icepod-core",
  "crates/icepod-audio-service",
  "crates/icepod-app",
  "crates/icepodctl",
]
resolver = "3"

[workspace.metadata.crane]
name = "icepod"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/caniko/icepod"

[workspace.dependencies]
assert_no_alloc = { version = "1.1.2", default-features = false, features = ["warn_debug", "warn_release"] }
bwavfile = "2.0.1"
clap = { version = "4.5", features = ["derive"] }
cpal = "0.18.2"
crc32fast = "1.5"
directories = "6"
fs2 = "0.4"
iced = { version = "0.14.0", features = ["tokio", "wgpu"] }
interprocess = { version = "2.4.3", features = ["tokio"] }
miette = { version = "7.6", features = ["fancy"] }
postcard = { version = "1.1.3", features = ["use-std"] }
proptest = "1.8"
rtrb = "0.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "serde"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
